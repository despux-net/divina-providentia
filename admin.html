<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Divina Providentia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5b1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #d4af37;
        }

        .product-price {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #f4e5b1;
        }

        .upload-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 20px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5b1 100%);
            color: #1a1a2e;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .file-input-label:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .upload-btn {
            width: 100%;
            padding: 12px 20px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .upload-btn:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.02);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: center;
        }

        .status-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }

        .status-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .status-loading {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #FFC107;
            color: #FFC107;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #d4af37;
        }
    </style>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="container">
        <h1>🏛️ Admin - Gestión de Productos</h1>
        <div id="productsContainer" class="products-grid">
            <div class="loading">Cargando productos...</div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let products = [];

        async function loadProducts() {
            const container = document.getElementById('productsContainer');

            const { data, error } = await window.SupabaseAPI.getProducts();

            if (error || !data) {
                container.innerHTML = '<div class="loading">Error al cargar productos</div>';
                return;
            }

            products = data;
            displayProducts();
        }

        function displayProducts() {
            const container = document.getElementById('productsContainer');

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        ${product.image_url
                    ? `<img src="${product.image_url}" alt="${product.name}">`
                    : '🏛️'
                }
                    </div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">$${parseFloat(product.price).toFixed(2)}</div>
                    
                    <div class="upload-section">
                        <div class="file-input-wrapper">
                            <input 
                                type="file" 
                                id="file-${product.id}" 
                                accept="image/*"
                                onchange="handleFileSelect(${product.id}, this)"
                            >
                            <label for="file-${product.id}" class="file-input-label">
                                📷 Seleccionar Imagen
                            </label>
                        </div>
                        <button 
                            class="upload-btn" 
                            id="upload-btn-${product.id}"
                            onclick="uploadImage(${product.id})"
                            disabled
                        >
                            Subir Imagen
                        </button>
                        <div id="status-${product.id}"></div>
                    </div>
                </div>
            `).join('');
        }

        const selectedFiles = {};

        function handleFileSelect(productId, input) {
            if (input.files && input.files[0]) {
                selectedFiles[productId] = input.files[0];
                document.getElementById(`upload-btn-${productId}`).disabled = false;

                // Preview
                const reader = new FileReader();
                reader.onload = function (e) {
                    const card = input.closest('.product-card');
                    const imageDiv = card.querySelector('.product-image');
                    imageDiv.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function uploadImage(productId) {
            const file = selectedFiles[productId];
            if (!file) return;

            const statusDiv = document.getElementById(`status-${productId}`);
            const uploadBtn = document.getElementById(`upload-btn-${productId}`);

            uploadBtn.disabled = true;
            statusDiv.innerHTML = '<div class="status-message status-loading">Subiendo imagen...</div>';

            try {
                const { data, error } = await window.SupabaseAPI.uploadProductImage(file, productId);

                if (error) throw error;

                statusDiv.innerHTML = '<div class="status-message status-success">✓ Imagen subida exitosamente</div>';

                // Reload products to show new image
                setTimeout(() => {
                    loadProducts();
                }, 1500);

            } catch (error) {
                console.error('Error uploading image:', error);
                statusDiv.innerHTML = `<div class="status-message status-error">✗ Error: ${error.message}</div>`;
                uploadBtn.disabled = false;
            }
        }

        // Load products on page load
        loadProducts();
    </script>
</body>

</html>
