# Indexador de Vivinati Industrial (scripts/industrial/indexar.mjs): productos
# que proveedores venezolanos publican en su propia web (Camozzi Venezuela,
# FRASAM…). Una vez al día, con calma. Gratis.
name: Indexador Industrial

on:
  schedule:
    - cron: '40 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexador-industrial
  cancel-in-progress: false

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Indexar proveedores
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_MINUTOS: '50'
        run: node scripts/industrial/indexar.mjs
