# Indexa anuncios de otras webs inmobiliarias (scripts/indexador/).
# Se ejecuta cada 6 horas. También se lanza a mano:
#  - desde Pages CMS, botón «Indexar inmuebles ahora» (manda «payload»), o
#  - desde GitHub → Actions → «Indexador de inmuebles» → Run workflow.
name: Indexador de inmuebles

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      payload:
        description: Datos que manda Pages CMS (JSON)
        required: false
        type: string
      max_fichas:
        description: Máximo de fichas por fuente en esta ejecución
        required: false
        default: '1500'

permissions:
  contents: read

# Nunca dos indexadores a la vez: se pisarían y cargarían de más a las fuentes.
concurrency:
  group: indexador
  cancel-in-progress: false

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # El número puede venir del botón de Pages CMS (payload.inputs.max_fichas),
      # del formulario de GitHub o, en la pasada programada, del valor por defecto.
      # El payload se lee como variable de entorno y se valida como número
      # para que nada de lo que llegue ahí pueda ejecutarse como comando.
      - name: Decidir cuántas fichas
        id: limite
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          MAX_GITHUB: ${{ github.event.inputs.max_fichas }}
        run: |
          n=$(node -e '
            let n;
            try { n = JSON.parse(process.env.PAYLOAD || "{}")?.inputs?.max_fichas; } catch {}
            n = Number(n ?? process.env.MAX_GITHUB ?? 1500);
            if (!Number.isFinite(n) || n < 1) n = 1500;
            console.log(Math.min(Math.round(n), 1800));
          ')
          echo "Fichas como máximo: $n"
          echo "max=$n" >> "$GITHUB_OUTPUT"

      - name: Indexar fuentes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_FICHAS: ${{ steps.limite.outputs.max }}
          MAX_MINUTOS: '320'
        run: node scripts/indexador/indexar.mjs
