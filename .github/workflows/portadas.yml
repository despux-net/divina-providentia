# Calidad de los anuncios externos, cada día después del indexador. Gratis.
# 1) Antispam: retira lo que no es un inmueble (blog, servicios, preguntas).
# 2) Portadas con cara: los anuncios cuya primera foto es el cartel de un
#    agente van al final de la portada y del orden «recientes» (OpenCV YuNet).
name: Calidad de anuncios

on:
  schedule:
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portadas
  cancel-in-progress: false

jobs:
  portadas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar OpenCV
        run: pip install --quiet opencv-python-headless==4.10.0.84 numpy
      - name: Revisar portadas
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/portadas/revisar.py
