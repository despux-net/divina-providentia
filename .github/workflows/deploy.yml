name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Se ejecuta cuando haces push a la rama main
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

# Permisos necesarios para desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que múltiples deploys se ejecuten simultáneamente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # La tienda de ropa está retirada (copia íntegra en la rama
      # «tienda-ropa» y la etiqueta «tienda-ropa-2026-11-16»). Ahora solo se
      # publica la carpeta site/, que es la nueva web del buscador de
      # inmuebles. Los archivos viejos siguen en el repo pero no salen a la web.
      - name: Preparar la carpeta que se publica
        run: |
          cp CNAME site/CNAME
          echo "Archivos que se publican:"
          ls -1 site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
