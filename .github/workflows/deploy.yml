name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Se ejecuta cuando haces push a la rama main
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

# Permisos necesarios para desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que múltiples deploys se ejecuten simultáneamente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # El sitio se publicaba con el repositorio entero, así que cualquiera
      # podía descargar de divinaprovidentia.com el código de las funciones
      # de Supabase, los scripts y los archivos de prueba. Aquí se recorta
      # la copia de trabajo antes de empaquetarla: solo afecta al artefacto
      # que se publica, no al repositorio.
      - name: Quitar del despliegue lo que no es la web
        run: |
          rm -rf supabase .github
          rm -f *.bat *.py *.sql test-*.js auto-upload.js carousel-new.js
          rm -f *.md .processed-lookbook.json package*.json
          rm -f debug.html debug-db.html test-products.html
          echo "Archivos que se publican:"
          ls -1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube el contenido del repositorio ya recortado
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
