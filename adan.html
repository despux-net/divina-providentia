<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=2">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        /* Viewer Layout */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Prevent page scroll */
            background-color: var(--color-bg, #0a0a0a);
        }

        /* Adjust navbar to stay on top without breaking layout */
        .navbar {
            z-index: 1000;
        }

        .viewer-container {
            position: relative;
            width: 100%;
            height: 100vh;
            /* Full height */
            margin-top: 0;
            padding-top: 80px;
            /* Offset for navbar */
            box-sizing: border-box;
            background-color: #050505;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-divine-gold);
            font-family: var(--font-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            z-index: 999;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid var(--color-divine-gold);
            backdrop-filter: blur(5px);
        }

        /* Ocultar botones de Leaflet defaul, usaremos scroll o doble tap */
        .leaflet-control-zoom {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="LOGOV3.png" alt="Divina Providentia Logo" class="logo-image">
            </a>
            <ul class="nav-links">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#filosofia">Filosofía</a></li>
                <li><a href="news.html">Noticias</a></li>
                <li><a href="cripta.html">Librería</a></li>
                <li><a href="index.html#tienda">Tienda</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li class="nav-lang-selector dropdown">
                    <button class="lang-dropbtn" aria-label="Seleccionar idioma">
                        🌐 <span class="lang-text">Idioma</span>
                    </button>
                    <div class="lang-dropdown-content">
                        <a href="#" onclick="changeLanguage('en'); return false;">🇬🇧 English</a>
                        <a href="#" onclick="changeLanguage('es'); return false;">🇪🇸 Español</a>
                        <a href="#" onclick="changeLanguage('de'); return false;">🇩🇪 Deutsch</a>
                    </div>
                </li>
            </ul>
            <button class="mobile-menu-button" aria-label="Menú móvil">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Map Viewer -->
    <div class="viewer-container" id="viewerContainer">
        <div class="loading-overlay" id="loadingText">
            <h3>Descargando Pergamino Maestro...</h3>
            <p>90 Megabytes. Por favor, espera mientras se decodifican los 180 millones de píxeles...</p>
        </div>
        <div id="map"></div>
    </div>

    <!-- Controles Flotantes Personalizados -->
    <div class="viewer-controls"
        style="position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); display:flex; gap:1rem; z-index:900; background:rgba(10,10,10,0.8); padding:0.8rem 1.5rem; border-radius:50px; border:1px solid rgba(212,175,55,0.3);">
        <button class="viewer-btn" id="zoomOutBtn"
            style="background:transparent; color:#b0b0b0; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.5rem;">-</button>
        <button class="viewer-btn" id="resetBtn"
            style="background:transparent; color:#b0b0b0; border:none; padding: 0 1rem; border-radius:20px; cursor:pointer; font-family:'Cinzel', serif;">Centrar</button>
        <button class="viewer-btn" id="zoomInBtn"
            style="background:transparent; color:#b0b0b0; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.5rem;">+</button>
    </div>

    <!-- Leaflet JS y Scripts del Proyecto -->
    <script src="content-loader.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingText = document.getElementById('loadingText');

            // Array de proxies CORS para evadir las restricciones de Google Drive
            // api.allorigins.win devuelve el binario crudo perfecto para imágenes gigantes.
            const rawDriveUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(`https://drive.google.com/uc?export=download&id=1tQiiSx-XvFTsUOeO0Dc5rbdSx5NobJr4`);

            // Leaflet map setup using flat coordinate system (CRS.Simple)
            const map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -4,  // Permite alejar muchisimo
                maxZoom: 5,   // Permite un zoom extremadamente profundo
                zoomControl: false, // Usaremos nuestros botones personalizados
                zoomSnap: 0.1, // Zoom más fluido
                wheelPxPerZoomLevel: 120 // Rueda de ratón normal
            });

            // Dimensiones base (puede ser ajustado al cargar la imagen real)
            let w = 15000;
            let h = 15000;

            const img = new Image();
            img.crossOrigin = "Anonymous";

            img.onload = function () {
                loadingText.style.display = 'none';
                w = this.naturalWidth;
                h = this.naturalHeight;

                // Añadir la inmensa imagen al framework vectorial Cartográfico (Leaflet)
                const overlay = L.imageOverlay(img.src, [[0, 0], [h, w]]).addTo(map);

                // Centrar y adaptar primera vista
                map.fitBounds([[0, 0], [h, w]]);
                map.setZoom(-1.5); // Nivel de zoom de inicio
            }

            img.onerror = function () {
                loadingText.innerHTML = "Error crítico al enlazar el pergamino.<br>Google Drive podría estar bloqueando el proxy.";
            }

            // Iniciar carga
            img.src = rawDriveUrl;

            // Vincular botones UI a Leaflet
            document.getElementById('zoomInBtn').addEventListener('click', () => map.zoomIn(1)); // 1 nivel zoom in
            document.getElementById('zoomOutBtn').addEventListener('click', () => map.zoomOut(1)); // 1 nivel zoom out
            document.getElementById('resetBtn').addEventListener('click', () => {
                map.fitBounds([[0, 0], [h, w]]);
            });
        });
    </script>
</body>

</html>
