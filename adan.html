<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Adán | Divina Providentia</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=2">

    <style>
        /* Viewer Layout */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Prevent page scroll */
            background-color: var(--color-bg, #0a0a0a);
        }

        /* Adjust navbar to stay on top without breaking layout */
        .navbar {
            z-index: 1000;
        }

        .viewer-container {
            position: relative;
            width: 100%;
            height: 100vh;
            /* Full height */
            margin-top: 0;
            padding-top: 80px;
            /* Offset for navbar */
            box-sizing: border-box;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .viewer-container:active {
            cursor: grabbing;
        }

        #mapImage {
            position: absolute;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
            /* Smooth snapping */
            /* Prevents image from being selected/dragged natively */
            user-select: none;
            -webkit-user-drag: none;
            max-width: none;
            max-height: none;
        }

        /* Controls UI */
        .viewer-controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 900;
            background: rgba(10, 10, 10, 0.8);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }

        .viewer-controls.loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .viewer-btn {
            background: transparent;
            color: var(--color-silver, #b0b0b0);
            border: none;
            font-family: var(--font-primary, 'Cinzel', serif);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .viewer-btn:hover {
            color: var(--color-divine-gold, #d4af37);
            background: rgba(212, 175, 55, 0.1);
        }

        .viewer-btn.reset-btn {
            font-size: 0.9rem;
            width: auto;
            padding: 0 1rem;
            border-radius: 20px;
        }

        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-divine-gold);
            font-family: var(--font-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="LOGOV3.png" alt="Divina Providentia Logo" class="logo-image">
            </a>
            <ul class="nav-links">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#filosofia">Filosofía</a></li>
                <li><a href="news.html">Noticias</a></li>
                <li><a href="cripta.html">Librería</a></li>
                <li><a href="index.html#tienda">Tienda</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li class="nav-lang-selector dropdown">
                    <button class="lang-dropbtn" aria-label="Seleccionar idioma">
                        🌐 <span class="lang-text">Idioma</span>
                    </button>
                    <div class="lang-dropdown-content">
                        <a href="#" onclick="changeLanguage('en'); return false;">🇬🇧 English</a>
                        <a href="#" onclick="changeLanguage('es'); return false;">🇪🇸 Español</a>
                        <a href="#" onclick="changeLanguage('de'); return false;">🇩🇪 Deutsch</a>
                    </div>
                </li>
            </ul>
            <button class="mobile-menu-button" aria-label="Menú móvil">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Map Viewer -->
    <div class="viewer-container" id="viewerContainer">
        <div class="loading-overlay" id="loadingText">
            <div>Desplegando el Pergamino de Adán (160 millones de pixeles)...</div>
        </div>
        <!-- Load the ultra-compressed 8MB WebP image locally -->
        <img src="MAPADAN.webp" alt="Mapa de Adán" id="mapImage" style="opacity: 0;">
    </div>

    <!-- Controls -->
    <div class="viewer-controls loading" id="controls">
        <button class="viewer-btn" id="zoomOutBtn" title="Alejar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <button class="viewer-btn reset-btn" id="resetBtn" title="Centrar">Restaurar</button>
        <button class="viewer-btn" id="zoomInBtn" title="Acercar" style="font-weight:bold; font-size:1.5rem;">
            +
        </button>
    </div>

    <script src="content-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('viewerContainer');
            const img = document.getElementById('mapImage');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetBtn = document.getElementById('resetBtn');
            const controls = document.getElementById('controls');
            const loadingText = document.getElementById('loadingText');

            let scale = 1;
            let currentX = 0;
            let currentY = 0;

            // Interaction states
            let isDragging = false;
            let startX, startY;
            let initialX, initialY;

            // Canvas Rendering Logic for extreme-size memory safety
            const canvas = document.createElement('canvas');
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.touchAction = 'none'; // Prevent browser native zoom/pan
            container.appendChild(canvas);

            const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for non-transparent map
            img.style.display = 'none'; // Hide the raw dom image completely to free VRAM

            // Resize canvas to physical pixels for sharpness
            function resizeCanvas() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                render();
            }

            // Draw only the visible portion of the 8K map
            function render() {
                // Clear the black void
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (!img.complete || img.naturalHeight === 0) return;

                // Calculate source coordinates (what part of the 8192px image to look at)
                // currentX/currentY is the visual offset in DOM coordinates
                // We must reverse-map this to the source image pixels

                ctx.save();

                // Set the transformation matrix for zoom and pan
                ctx.translate(currentX, currentY);
                ctx.scale(scale, scale);

                // Only draw the image. Browsers will auto-cull out-of-bounds pixels in canvas rendering much better than DOM images
                ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);

                ctx.restore();
            }

            // Initialize position safely
            function initPosition() {
                controls.classList.remove('loading');
                loadingText.style.display = 'none';

                resizeCanvas();

                const imgWidth = img.naturalWidth || 8192;
                const imgHeight = img.naturalHeight || 8192;

                const scaleX = canvas.width / imgWidth;
                const scaleY = canvas.height / imgHeight;
                scale = Math.min(scaleX, scaleY);

                currentX = (canvas.width - (imgWidth * scale)) / 2;
                currentY = (canvas.height - (imgHeight * scale)) / 2;

                render();
            }

            // RequestAnimationFrame loop for butter smooth 60fps panning
            let animationFrameId;
            function requestRender() {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(render);
            }

            // Mouse Drag (Panning)
            container.addEventListener('mousedown', (e) => {
                if (controls.classList.contains('loading')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialX = currentX;
                initialY = currentY;
                container.style.cursor = 'grabbing';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                currentX = initialX + (e.clientX - startX);
                currentY = initialY + (e.clientY - startY);
                requestRender();
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    container.style.cursor = 'grab';
                }
            });
            container.addEventListener('mouseleave', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            // Touch Drag (Panning for mobile)
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && !controls.classList.contains('loading')) {
                    isDragging = true;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    initialX = currentX;
                    initialY = currentY;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                currentX = initialX + (e.touches[0].clientX - startX);
                currentY = initialY + (e.touches[0].clientY - startY);
                requestRender();
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Zoom logic
            function zoom(delta, mouseX = null, mouseY = null) {
                if (controls.classList.contains('loading')) return;
                const oldScale = scale;
                scale *= delta;

                // Allow extreme zoom on 8K map (0.01x to 15x zoom index)
                scale = Math.max(0.01, Math.min(scale, 15));

                const x = mouseX !== null ? mouseX : (canvas.width / 2);
                const y = mouseY !== null ? mouseY : (canvas.height / 2);

                currentX = x - (x - currentX) * (scale / oldScale);
                currentY = y - (y - currentY) * (scale / oldScale);

                requestRender();
            }

            // Zoom Buttons
            zoomInBtn.addEventListener('click', () => zoom(1.3));
            zoomOutBtn.addEventListener('click', () => zoom(1 / 1.3));
            resetBtn.addEventListener('click', () => {
                initPosition();
            });

            // Mouse Wheel Zoom
            container.addEventListener('wheel', (e) => {
                if (controls.classList.contains('loading')) return;
                e.preventDefault();
                const delta = e.deltaY < 0 ? 1.1 : (1 / 1.1);

                // Zoom towards mouse pointer
                const containerRect = container.getBoundingClientRect();
                const mouseX = e.clientX - containerRect.left;
                const mouseY = e.clientY - containerRect.top;

                zoom(delta, mouseX, mouseY);
            }, { passive: false });

            // Initialize on load
            if (img.complete && img.naturalHeight !== 0) {
                initPosition();
            } else {
                img.addEventListener('load', initPosition);
                img.addEventListener('error', () => {
                    loadingText.innerHTML = "Error crítico al cargar el mapa gigantesco.<br>Verifique su conexión o recargue la página.";
                });
            }

            // Handle window resize
            window.addEventListener('resize', () => {
                if (!controls.classList.contains('loading')) {
                    // Update bounds logic if needed
                }
            });
        });
    </script>
</body>

</html>
