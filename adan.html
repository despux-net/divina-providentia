<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Adán | Divina Providentia</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=2">

    <style>
        /* Viewer Layout */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Prevent page scroll */
            background-color: var(--color-bg, #0a0a0a);
        }

        /* Adjust navbar to stay on top without breaking layout */
        .navbar {
            z-index: 1000;
        }

        .viewer-container {
            position: relative;
            width: 100%;
            height: 100vh;
            /* Full height */
            margin-top: 0;
            padding-top: 80px;
            /* Offset for navbar */
            box-sizing: border-box;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .viewer-container:active {
            cursor: grabbing;
        }

        #mapImage {
            position: absolute;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
            /* Smooth snapping */
            will-change: transform;
            /* Prevents image from being selected/dragged natively */
            user-select: none;
            -webkit-user-drag: none;
            max-width: none;
            max-height: none;
        }

        /* Controls UI */
        .viewer-controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 900;
            background: rgba(10, 10, 10, 0.8);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }

        .viewer-controls.loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .viewer-btn {
            background: transparent;
            color: var(--color-silver, #b0b0b0);
            border: none;
            font-family: var(--font-primary, 'Cinzel', serif);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .viewer-btn:hover {
            color: var(--color-divine-gold, #d4af37);
            background: rgba(212, 175, 55, 0.1);
        }

        .viewer-btn.reset-btn {
            font-size: 0.9rem;
            width: auto;
            padding: 0 1rem;
            border-radius: 20px;
        }

        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-divine-gold);
            font-family: var(--font-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="LOGOV3.png" alt="Divina Providentia Logo" class="logo-image">
            </a>
            <ul class="nav-links">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#filosofia">Filosofía</a></li>
                <li><a href="news.html">Noticias</a></li>
                <li><a href="cripta.html">Librería</a></li>
                <li><a href="index.html#tienda">Tienda</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li class="nav-lang-selector dropdown">
                    <button class="lang-dropbtn" aria-label="Seleccionar idioma">
                        🌐 <span class="lang-text">Idioma</span>
                    </button>
                    <div class="lang-dropdown-content">
                        <a href="#" onclick="changeLanguage('en'); return false;">🇬🇧 English</a>
                        <a href="#" onclick="changeLanguage('es'); return false;">🇪🇸 Español</a>
                        <a href="#" onclick="changeLanguage('de'); return false;">🇩🇪 Deutsch</a>
                    </div>
                </li>
            </ul>
            <button class="mobile-menu-button" aria-label="Menú móvil">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Map Viewer -->
    <div class="viewer-container" id="viewerContainer">
        <!-- El visor interactivo propio de Google Drive, maneja tamaños monstruosos dividiendo en tiles y evade el límite de antivirus -->
        <iframe src="https://drive.google.com/file/d/1tQiiSx-XvFTsUOeO0Dc5rbdSx5NobJr4/preview?usp=sharing" width="100%"
            height="100%" style="border:none;" allow="fullscreen"></iframe>
    </div>

    <!-- Controls -->
    <div class="viewer-controls loading" id="controls">
        <button class="viewer-btn" id="zoomOutBtn" title="Alejar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <button class="viewer-btn reset-btn" id="resetBtn" title="Centrar">Restaurar</button>
        <button class="viewer-btn" id="zoomInBtn" title="Acercar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>

    <script src="content-loader.js"></script>
    <script>
        // La interactividad (pan & zoom) ahora la maneja el visualizador de Google Drive dentro del Iframe
        document.addEventListener('DOMContentLoaded', () => {
            const controls = document.getElementById('controls');
            if (controls) {
                // Borramos los controles manuales porque Drive ya trae los suyos (mejores controlados por tiles)
                controls.style.display = 'none';
            }
        });
    </script>
</body>

</html>
