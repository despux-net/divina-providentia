<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Adán | Divina Providentia</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=2">

    <style>
        /* Viewer Layout */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-bg, #0a0a0a);
        }

        .navbar {
            z-index: 1000;
        }

        .viewer-container {
            position: relative;
            width: 100%;
            height: 100vh;
            margin-top: 0;
            padding-top: 80px;
            box-sizing: border-box;
            background-color: #050505;
        }

        #openseadragon-viewer {
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        /* Loading overlay initial */
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-divine-gold);
            font-family: var(--font-primary);
            text-align: center;
            z-index: 999;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .loading-overlay h3 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        /* Custom OS Controls */
        .viewer-controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 900;
            background: rgba(10, 10, 10, 0.8);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .viewer-btn {
            background: transparent;
            color: var(--color-silver, #b0b0b0);
            border: none;
            font-family: var(--font-primary, 'Cinzel', serif);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .viewer-btn:hover {
            color: var(--color-divine-gold, #d4af37);
            background: rgba(212, 175, 55, 0.1);
        }

        .viewer-btn.reset-btn {
            font-size: 0.9rem;
            width: auto;
            padding: 0 1rem;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="LOGOV3.png" alt="Divina Providentia Logo" class="logo-image">
            </a>
            <ul class="nav-links">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#filosofia">Filosofía</a></li>
                <li><a href="news.html">Noticias</a></li>
                <li><a href="cripta.html">Librería</a></li>
                <li><a href="index.html#tienda">Tienda</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li class="nav-lang-selector dropdown">
                    <button class="lang-dropbtn" aria-label="Seleccionar idioma">
                        🌐 <span class="lang-text">Idioma</span>
                    </button>
                    <div class="lang-dropdown-content">
                        <a href="#" onclick="changeLanguage('en'); return false;">🇬🇧 English</a>
                        <a href="#" onclick="changeLanguage('es'); return false;">🇪🇸 Español</a>
                        <a href="#" onclick="changeLanguage('de'); return false;">🇩🇪 Deutsch</a>
                    </div>
                </li>
            </ul>
            <button class="mobile-menu-button" aria-label="Menú móvil">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Deep Zoom Viewer -->
    <div class="viewer-container">
        <div class="loading-overlay" id="loadingText">
            <h3>Preparando el Pergamino de Adán</h3>
            <p style="color:#b0b0b0;">Iniciando motor inmersivo de cartografía fractal...</p>
        </div>

        <div id="openseadragon-viewer"></div>

        <!-- Custom Controls tied to OpenSeadragon automatically by ID -->
        <div class="viewer-controls" id="osd-ui">
            <button class="viewer-btn" id="zoom-out-btn" title="Alejar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <button class="viewer-btn reset-btn" id="home-btn" title="Centrar">Restaurar</button>
            <button class="viewer-btn" id="zoom-in-btn" title="Acercar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <!-- Hidden Fullscreen button we can use if needed later via API -->
            <button id="full-page-btn" style="display:none;"></button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="content-loader.js"></script>
    <!-- Incluir motor nativo para gigantescas imágenes (Google Maps style) -->
    <script src="openseadragon.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingText = document.getElementById('loadingText');

            // Initialize OpenSeadragon Viewer
            // This reads the XML (.dzi) and fetches small 512px JPGs on-the-fly from Github Pages perfectly
            const viewer = OpenSeadragon({
                id: "openseadragon-viewer",
                prefixUrl: "images/", // UI icons internal
                tileSources: "mapadan.dzi", // El XML generado con las piramides DZI

                // Bind our custom styled HTML buttons
                zoomInButton: "zoom-in-btn",
                zoomOutButton: "zoom-out-btn",
                homeButton: "home-btn",
                fullPageButton: "full-page-btn",

                // Fluid kinematics (Mobile friendly)
                animationTime: 1.2,
                blendTime: 0.1,
                alwaysBlend: false,

                // Restrict zoom limits
                minZoomImageRatio: 0.8, // Fit entirely in screen
                maxZoomPixelRatio: 3, // Let them zoom 3x closer than native crystal clear pixels (Ultra Deep Dive)

                // Gestures
                gestureSettingsMouse: {
                    clickToZoom: false, // Let them use scroll wheel instead to avoid misclicks
                    scrollToZoom: true
                },
                gestureSettingsTouch: {
                    pinchToZoom: true,
                    scrollToZoom: false
                },

                // Visibility
                visibilityRatio: 1.0, // Image won't be easily panned completely off screen
                constrainDuringPan: true
            });

            // Smoothly remove loading text once the first map tile opens
            viewer.addHandler('open', () => {
                loadingText.style.opacity = '0';
                setTimeout(() => { loadingText.style.display = 'none'; }, 500);
            });

            // Handle loading error just in case Github has a lag spike
            viewer.addHandler('open-failed', () => {
                loadingText.innerHTML = "<h3>El tiempo fluye extraño hoy</h3><p>No se pudo conectar con el repositorio visual. Refresca la página.</p>";
            });
        });
    </script>
</body>

</html>
