<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divina Providentia — Buscador de inmuebles en Venezuela</title>
  <meta name="description" content="Busca apartamentos, casas, anexos, locales y terrenos en venta y alquiler en toda Venezuela. Publica tu inmueble gratis.">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="estilos.css?v=3">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-int">
      <a class="marca" href="index.html">Divina Providentia<small>Inmuebles en Venezuela</small></a>
      <nav class="nav">
        <a class="boton peq" href="publicar.html">Publicar gratis</a>
        <span data-nav-sesion></span>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <section class="hero">
      <h1>Encuentra tu próximo hogar en Venezuela</h1>
      <form class="barra" id="form-busqueda" role="search">
        <input type="search" id="q" name="q" placeholder="Ej.: apartamento en alquiler en Chacao" aria-label="Buscar inmuebles">
        <button class="boton" type="submit">Buscar</button>
      </form>
      <div class="filtros">
        <select id="f-operacion" aria-label="Operación"></select>
        <select id="f-tipo" aria-label="Tipo de inmueble"></select>
        <select id="f-estado" aria-label="Estado"></select>
        <input type="number" id="f-min" min="0" step="any" placeholder="Precio mín. (USD)" aria-label="Precio mínimo en dólares">
        <input type="number" id="f-max" min="0" step="any" placeholder="Precio máx. (USD)" aria-label="Precio máximo en dólares">
        <select id="f-hab" aria-label="Habitaciones">
          <option value="">Habitaciones</option>
          <option value="1">1 o más</option><option value="2">2 o más</option>
          <option value="3">3 o más</option><option value="4">4 o más</option>
        </select>
        <select id="f-orden" aria-label="Ordenar">
          <option value="recientes">Más recientes</option>
          <option value="relevancia">Más relevantes</option>
          <option value="precio_asc">Precio: menor a mayor</option>
          <option value="precio_desc">Precio: mayor a menor</option>
        </select>
      </div>
    </section>

    <div class="resumen">
      <span id="resumen" aria-live="polite">Buscando…</span>
      <div class="vistas" role="group" aria-label="Vista">
        <button type="button" id="v-lista" aria-pressed="true">Lista</button>
        <button type="button" id="v-mapa" aria-pressed="false">Mapa</button>
      </div>
    </div>

    <div id="resultados" class="rejilla"></div>
    <div id="mapa" hidden></div>
    <div class="mas"><button class="boton sec" id="mas" hidden>Ver más</button></div>
  </main>

  <footer class="pie">© Divina Providentia · Los anuncios son responsabilidad de quien los publica. · <a href="bot.html">Cómo encontramos anuncios de otras webs</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="comun.js?v=3"></script>
  <script src="buscar.js?v=2"></script>
</body>
</html>
