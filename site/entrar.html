<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Divina Providentia</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="estilos.css?v=3">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-int">
      <a class="marca" href="index.html">Divina Providentia<small>Inmuebles en Venezuela</small></a>
      <nav class="nav"><a href="index.html">Buscar</a><span data-nav-sesion></span></nav>
    </div>
  </header>

  <main class="contenedor">
    <div class="form cuenta">
      <div id="activada" hidden class="mensaje ok"><strong>¡Cuenta activada!</strong> Ya puedes publicar tus inmuebles.</div>

      <section id="bloque-entrar">
        <h1>Entrar</h1>
        <p class="sub">¿No tienes cuenta? <a href="registro.html" id="link-registro">Créala gratis</a>.</p>
        <form id="form-entrar" novalidate>
          <fieldset>
            <div class="campo"><label for="email">Correo electrónico</label>
              <input type="email" id="email" autocomplete="email" required></div>
            <div class="campo"><label for="clave">Contraseña</label>
              <input type="password" id="clave" autocomplete="current-password" required></div>
            <p style="margin:0"><a href="#" id="link-olvido">¿Olvidaste tu contraseña?</a></p>
          </fieldset>
          <div id="antirrobot" class="antirrobot"></div>
          <div id="msg"></div>
          <button class="boton" type="submit" id="btn">Entrar</button>
          <button class="boton sec" type="button" id="btn-reenviar" hidden>Reenviar correo de activación</button>
        </form>
      </section>

      <section id="bloque-olvido" hidden>
        <h1>Recuperar contraseña</h1>
        <p class="sub">Te enviaremos un enlace para elegir una contraseña nueva.</p>
        <form id="form-olvido" novalidate>
          <fieldset>
            <div class="campo"><label for="email-olvido">Correo de tu cuenta</label>
              <input type="email" id="email-olvido" autocomplete="email" required></div>
          </fieldset>
          <div id="antirrobot-olvido" class="antirrobot"></div>
          <div id="msg-olvido"></div>
          <button class="boton" type="submit" id="btn-olvido">Enviar enlace</button>
          <button class="boton sec" type="button" id="volver-entrar">Volver</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="pie">© Divina Providentia</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="comun.js?v=4"></script>
  <script src="entrar.js?v=1"></script>
</body>
</html>
