<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8fc"/>
      <stop offset=".65" stop-color="#eaf5fe"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="avila1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d3f5"/>
      <stop offset="1" stop-color="#cfe6f9"/>
    </linearGradient>
    <linearGradient id="avila2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc3ef"/>
      <stop offset="1" stop-color="#bcdcf6"/>
    </linearGradient>
    <linearGradient id="edif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f0fb"/>
    </linearGradient>
    <pattern id="ventanas" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="10" height="13" rx="1.5" fill="#b9d9f4"/>
    </pattern>
    <pattern id="ventanas2" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="8" height="10" rx="1.5" fill="#9ccaf0"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#cielo)"/>
  <!-- sol suave y nubes -->
  <circle cx="1310" cy="110" r="70" fill="#ffffff" opacity=".7"/>
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="260" cy="90" rx="90" ry="20"/><ellipse cx="320" cy="78" rx="60" ry="22"/>
    <ellipse cx="980" cy="70" rx="110" ry="18"/><ellipse cx="1040" cy="60" rx="60" ry="18"/>
  </g>

  <!-- El Ávila: dos capas de montaña -->
  <path d="M0 300 C120 250 210 210 330 205 C430 200 500 160 600 150 C700 140 760 175 860 168 C960 160 1040 120 1150 128 C1260 136 1330 180 1440 190 C1520 197 1570 215 1600 225 L1600 520 L0 520 Z" fill="url(#avila1)"/>
  <path d="M0 345 C140 300 250 280 360 270 C470 260 540 230 650 228 C760 226 830 255 940 250 C1050 245 1120 215 1240 220 C1350 225 1450 260 1600 275 L1600 520 L0 520 Z" fill="url(#avila2)" opacity=".8"/>

  <!-- Edificios del fondo -->
  <g fill="#d6eaf9">
    <rect x="80" y="330" width="70" height="190"/><rect x="160" y="300" width="56" height="220"/>
    <rect x="420" y="315" width="80" height="205"/><rect x="700" y="290" width="64" height="230"/>
    <rect x="980" y="320" width="76" height="200"/><rect x="1240" y="305" width="60" height="215"/>
    <rect x="1480" y="325" width="72" height="195"/>
  </g>

  <!-- Edificios del frente con ventanas -->
  <g>
    <rect x="20" y="360" width="120" height="160" fill="url(#edif)" stroke="#cfe3f5"/>
    <rect x="20" y="360" width="120" height="160" fill="url(#ventanas)"/>
    <rect x="230" y="320" width="96" height="200" fill="url(#edif)" stroke="#cfe3f5"/>
    <rect x="230" y="320" width="96" height="200" fill="url(#ventanas2)"/>
    <rect x="336" y="380" width="140" height="140" fill="url(#edif)" stroke="#cfe3f5"/>
    <rect x="336" y="380" width="140" height="140" fill="url(#ventanas)"/>
    <rect x="560" y="270" width="110" height="250" fill="url(#edif)" stroke="#cfe3f5"/>
    <rect x="560" y="270" width="110" height="250" fill="url(#ventanas2)"/>
    <rect x="800" y="350" width="150" height="170" fill="url(#edif)" stroke="#cfe3f5"/>
    <rect x="800" y="350" width="150" height="170" fill="url(#ventanas)"/>
    <rect x="1080" y="300" width="100" height="220" fill="url(#edif)" stroke="#cfe3f5"/>
    <rect x="1080" y="300" width="100" height="220" fill="url(#ventanas2)"/>
    <rect x="1320" y="370" width="130" height="150" fill="url(#edif)" stroke="#cfe3f5"/>
    <rect x="1320" y="370" width="130" height="150" fill="url(#ventanas)"/>
  </g>

  <!-- Casas con techo -->
  <g fill="#ffffff" stroke="#cfe3f5">
    <path d="M480 440 l45 -38 l45 38 v80 h-90 z"/>
    <path d="M960 450 l40 -34 l40 34 v70 h-80 z"/>
    <path d="M1200 445 l42 -36 l42 36 v75 h-84 z"/>
  </g>
  <g fill="#9ccaf0">
    <rect x="514" y="470" width="22" height="50"/><rect x="990" y="478" width="20" height="42"/><rect x="1231" y="474" width="22" height="46"/>
  </g>

  <!-- Árboles -->
  <g fill="#a5d6a7" opacity=".75">
    <circle cx="160" cy="470" r="34"/><circle cx="700" cy="480" r="30"/><circle cx="1520" cy="470" r="36"/>
    <circle cx="1210" cy="500" r="22"/><circle cx="420" cy="495" r="24"/>
  </g>
  <rect y="508" width="1600" height="12" fill="#e3f0fb"/>
</svg>
