<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil — Vivinati</title>
  <meta name="description" content="Portafolio y anuncios de un creador en Vivinati: proyectos conceptuales 3D e inmuebles en Venezuela.">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#005CA7">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/img/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="stylesheet" href="/estilos.css?v=57">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-int">
      <a class="marca" href="/" aria-label="Vivinati — inicio"><picture><source media="(max-width: 560px)" srcset="/img/logo-vivinati-blanco-v2.png"><img src="/img/logo-vivinati-v2.png" alt="Vivinati" width="195" height="22"></picture></a>
      <nav class="nav"><a href="/realestate/">Inmuebles</a><a href="/industrial/">Industrial</a><a href="/sobre.html">Quiénes somos</a><span data-nav-sesion></span></nav>
    </div>
  </header>

  <main class="contenedor">
    <div class="vacio" id="no-existe" hidden><strong>Este perfil no existe</strong>
      <p><a class="boton" href="/realestate/conceptos.html">Ver proyectos conceptuales</a></p></div>

    <section class="perfil-publico" id="perfil" hidden>
      <nav class="pestanas-mercado" id="pestanas" aria-label="Perfil en cada mercado" hidden>
        <a id="tab-realestate">Real Estate</a>
        <a id="tab-industrial">Industrial</a>
      </nav>
      <div class="perfil-cabeza">
        <span id="avatar"></span>
        <div>
          <h1 id="nombre"></h1>
          <p class="autor-usuario" id="usuario"></p>
          <p id="valoracion"></p>
          <p class="perfil-resumen" id="resumen"></p>
          <p class="chips-datos perfil-etiquetas" id="etiquetas" hidden></p>
        </div>
        <div class="perfil-acciones">
          <a class="boton peq" id="escribir" hidden>Enviar mensaje</a>
          <span class="perfil-contactos" id="contactos"></span>
          <button type="button" class="boton sec peq" id="compartir">Compartir perfil</button>
        </div>
      </div>

      <section class="sobre-mi" id="sobre-mi" hidden>
        <h2>Sobre mí</h2>
        <p id="biografia"></p>
      </section>

      <section class="sobre-mi" id="profesional" hidden>
        <h2>Información profesional</h2>
        <dl class="datos-ind" id="datos-profesionales"></dl>
      </section>

      <section id="bloque-conceptos" hidden>
        <h2>Proyectos conceptuales</h2>
        <div class="rejilla resultados-cuatro" id="lista-conceptos"></div>
      </section>
      <section id="bloque-inmuebles" hidden>
        <h2>Inmuebles publicados</h2>
        <div class="rejilla resultados-cuatro" id="lista-inmuebles"></div>
      </section>
      <section id="bloque-productos" hidden>
        <h2>Publicaciones en Industrial</h2>
        <div class="rejilla resultados-cuatro" id="lista-productos"></div>
      </section>
      <div class="vacio" id="sin-nada" hidden><strong>Aún no hay publicaciones</strong></div>

      <section id="valoraciones">
        <h2 id="titulo-resenas">Valoraciones</h2>
        <div id="resumen-estrellas"></div>
        <div id="valorar"></div>
        <div class="resenas" id="resenas"></div>
      </section>
    </section>
  </main>

  <footer class="pie"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/comun.js?v=35"></script>
  <script src="/industrial/industrial.js?v=5"></script>
  <script src="/creador.js?v=6"></script>
</body>
</html>
