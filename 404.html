<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página no encontrada — Divina Providentia">
    <title>404 | Divina Providentia</title>

    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #fff;
            color: #000;
            font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
        }

        .error-page-wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .error-brand {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        .error-code {
            font-size: clamp(4rem, 18vw, 12rem);
            font-weight: 600;
            line-height: .9;
            letter-spacing: 0.02em;
            margin: 0;
        }

        .error-title {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin: 26px 0 0;
        }

        .error-message {
            font-size: 13px;
            line-height: 1.5;
            color: #767676;
            max-width: 420px;
            margin: 18px 0 40px;
        }

        .error-btn {
            display: inline-block;
            padding: 13px 44px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            transition: background .2s ease, color .2s ease;
        }

        .error-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="error-page-wrapper">
        <a href="/" class="error-brand" style="color:inherit;text-decoration:none">Divina Providentia</a>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Página no encontrada</h2>
        <p class="error-message">
            La ruta que buscas no existe o ha sido reubicada.
        </p>
        <a href="/" class="error-btn">Volver al inicio</a>
    </div>
</body>

</html>
