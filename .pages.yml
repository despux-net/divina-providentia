# ===================================================================
# VIVINATI — PAGES CMS (buscador de inmuebles)
#
# Se edita desde https://app.pagescms.org. Cada guardado es un commit
# en main y GitHub Pages publica la web sola (~1 minuto).
#
# Solo se publica la carpeta site/: por eso el contenido vive en
# site/contenido/ y las fotos subidas en site/media/.
#
# Las secciones de la antigua tienda de ropa (productos, lookbook, pie,
# apariencia) se quitaron de aquí el 2026-11-16; sus archivos siguen en
# content/ y la tienda completa en la rama «tienda-ropa».
# ===================================================================

media:
  input: site/media
  output: /media
  categories: [image]

content:

  # ---------------------------------------------------------------
  # Portada de vivinati.com: imagen de fondo del buscador y
  # textos principales. La lee site/portada.js al cargar la página.
  - name: portada
    label: Portada
    type: file
    path: site/contenido/portada.json
    format: json
    fields:
      - name: imagen_fondo
        label: Imagen de fondo del buscador
        description: >-
          Foto grande detrás del buscador. Mejor horizontal (por ejemplo
          1920 × 800 píxeles) y de menos de 1 MB. Si la dejas vacía se
          muestra la ilustración del Ávila.
        type: image
      - name: posicion
        label: Parte de la foto que se ve
        description: En pantallas estrechas se recorta la foto; elige qué parte conservar.
        type: select
        options:
          values:
            - name: center
              label: Centro
            - name: top
              label: Arriba
            - name: bottom
              label: Abajo
      - name: velo
        label: Velo blanco sobre la foto (%)
        description: >-
          Aclara la foto para que el buscador destaque. 0 = foto tal cual,
          30–50 = suave, 80 = casi blanco.
        type: number
        options:
          min: 0
          max: 80
      - name: titulo_buscador
        label: Título del buscador
        description: "Escribe {anuncios} donde quieras que salga el número de anuncios en vivo."
        type: string
        required: true
      - name: lema_buscador
        label: Frase bajo el título del buscador
        description: Explica los tres pilares (comprar, alquilar y conceptos 3D) en una frase.
        type: text
      - name: titulo_categorias
        label: Título de la sección de categorías
        type: string
      - name: subtitulo_categorias
        label: Texto bajo ese título
        type: text
      - name: sugerencias
        label: Zonas sugeridas bajo el buscador
        description: Cada una es un enlace que busca esa zona (por ejemplo Chacao, Valencia…).
        type: string
        list: true

# ---------------------------------------------------------------
# Botones generales (barra lateral de Pages CMS → «Actions»).
# Lanzan un workflow de GitHub con tu sesión de GitHub: solo quien
# tiene acceso al repositorio puede pulsarlos.
actions:
  - name: indexar-inmuebles
    label: Indexar inmuebles ahora
    workflow: indexador.yml
    confirm:
      title: Indexar inmuebles ahora
      message: >-
        Busca anuncios nuevos o cambiados en todas las webs inmobiliarias
        conectadas (Rent-A-House, Inmueble Oferta, RIV, Bolsa Inmobiliaria
        Caracas y varias oficinas RE/MAX), todas a la vez, y los añade al
        buscador. Cada web va a su ritmo (entre 5 y 10 segundos por página) y
        aparecen en la web de 10 en 10. Una pasada dura como mucho unas 5 horas.
        Si ya hay una en marcha, esta espera a que termine.
      button: Indexar
    fields:
      - name: max_fichas
        label: ¿Cuántos anuncios como máximo por web?
        type: number
        default: 5000
        required: false
